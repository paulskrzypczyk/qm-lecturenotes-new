# This file was created automatically with `myst init --gh-pages` 🪄 💚
# ... and extended to build the PDF of the notes (templates/latex/qm-notes) before the site,
# so that the "Lecture notes (PDF)" download on every page is always up to date.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  workflow_dispatch:
env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install MyST Markdown
        run: npm install -g mystmd

      # --- PDF of the notes -------------------------------------------------
      # TeX Live from Ubuntu's packages (covers everything used by
      # templates/latex/qm-notes/template.tex). Only GitHub's own actions are used.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Build PDF of the notes
        env:
          MYST_PDF: '1'
        run: |
          myst build --pdf
          ls -la exports/
      - name: Upload PDF as a workflow artifact (handy for checking a build)
        uses: actions/upload-artifact@v4
        with:
          name: QM-lecture-notes-pdf
          path: exports/QM-lecture-notes.pdf
      # ----------------------------------------------------------------------

      - name: Build HTML Assets
        run: myst build --html
      # The PDF is linked from every page (myst.yml `downloads`) at <site>/QM-lecture-notes.pdf,
      # so that it opens in the browser rather than being force-downloaded.
      - name: Add the PDF to the site
        run: cp exports/QM-lecture-notes.pdf _build/html/QM-lecture-notes.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
