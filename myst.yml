# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: Quantum Mechanics
  subject: Quantum Mechanics Lecture Notes
  description: Lecture Notes
  keywords: []
  authors:
  - name: Paul Skrzypczyk
    affiliations:
      - School of Physics, University of Bristol
  license: CC-BY-NC-ND-4.0
  plugins:
    - https://github.com/jupyter-book/myst-plugins/releases/download/page-last-updatedv1.1/page-last-updated.mjs
    - plugins/pdf-export.mjs
  # github:
  # Live code cells (Chapter 6) run in the browser with JupyterLite: no server needed.
  thebe:
    lite: true
  bibliography:
    - references.bib
  math:
    '\infint': '\int_{-\infty}^{\infty}'
    '\vph': '\vphantom{\Bigg|}'
    '\rI': '\mathrm{I}'
    '\rII': '\mathrm{II}'
    '\rIII': '\mathrm{III}'
    '\pd': '\wp'
    '\prob' : '\mathrm{prob}'
    '\op' : '\hat{#1}_{\mathrm{w}}'
    '\inner' : '\langle #1 | #2 \rangle'
    '\av' : '\langle #1 \rangle'
    '\init': '\mathrm{in}'
    '\rR': '\mathrm{R}'
    '\rL': '\mathrm{L}'
    '\ivec': '\boldsymbol{\hat{\imath}}'
    '\jvec': '\boldsymbol{\hat{\jmath}}'
    '\kvec': '\boldsymbol{\hat{k}}'
    '\rvec': '\boldsymbol{r}'
    '\Lvec': '\boldsymbol{L}'
    '\pvec': '\boldsymbol{p}'
    '\Ebox': 'E_{\text{box}}'
  # Download button on every page: the PDF built by the GitHub Action (MYST_PDF=1 myst build --pdf).
  # It is linked as a plain URL (static: false) rather than as a file, so that clicking it opens
  # the PDF in the browser instead of forcing a download. The Action copies exports/QM-lecture-notes.pdf
  # into the deployed site at this address.
  downloads:
    - url: https://paulskrzypczyk.github.io/qm-lecturenotes-new/QM-lecture-notes.pdf
      title: Lecture notes (PDF)
      static: false
  exports:
    # PDF of the notes in the style of the old LaTeX notes.
    # Build with:  MYST_PDF=1 myst build --pdf   (the env var switches on plugins/pdf-export.mjs)
    - id: pdf
      format: pdf
      template: ./templates/latex/qm-notes
      output: exports/QM-lecture-notes.pdf
      subtitle_text: Lecture Notes
      year: 2025-26
      articles:
        - file: 01-position.md
          level: 0
        - file: 02-momentum.md
          level: 0
        - file: 03-Incompat-obs-HUP.md
          level: 0
        - file: 04-energy.md
          level: 0
        - file: 05-time-evolution.md
          level: 0
        - file: 06-free-particle.md
          level: 0
        - file: 07-infinite-square-well.md
          level: 0
        - file: 08-harmonic-oscillator.md
          level: 0
        - file: 09-scattering.md
          level: 0
        - file: 10-QM-in-3D.md
          level: 0
        - file: 11-3D-infinite-box.md
          level: 0
        - file: gaussian-integrals.md
          level: 0
  abbreviations:
    TISE: Time-independent Schrödinger Equation
    SE: Schrödinger Equation
    HUP: Heisenberg Uncertainty Principle
    QM: Quantum Mechanics
  numbering:
    heading_1: true
    heading_2: true
    heading_3: true
    heading_4: true
site: 
  parts:
#    banner: I've had to hide the right-hand-side contents for the moment, as it was flashing on some browsers. I'll add it back in once this bug is fixed.
  template: book-theme
  title: Quantum Mechanics
  options:
    logo: ./Pictures/UoB_RGB_24.png
    logo_text: Quantum Mechanics
    favicon: psi.png
    style: ./style/style.css   # static figures get a light panel in dark mode (see the file)
    hide_authors: true
 #   hide_outline: true
  nav: 
  domains: []

#extends: 
# - export.yml

